format = """
$username\
$hostname\
$directory\
$git_branch\
$git_status\
$nix_shell\
$cmd_duration\
$line_break\
$character\
"""

[directory]
format = "[ ](#89b4fa)[ $path ]($style)"
style = "#89b4fa"
truncate_to_repo = false
truncation_length = 0

[character]
success_symbol = "[ ](#89b4fa)[ ➜](bold green)"
error_symbol = "[ ](#89b4fa)[ ➜](bold red)"

[cmd_duration]
format = "[󰔛 $duration ]($style)"
style = "bg:none fg:#f9e2af"
show_notifications = false

[nix_shell]
format = "[  nix-shell-env ]($style)"
style = "#89b4fa"